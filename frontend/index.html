<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城市功能区智能分析平台 | 边缘智能应用挑战赛</title>
    <link rel="stylesheet" href="static/style.css">

    <!-- 高德地图 Key 不再硬编码在本文件中。
         请复制 static/config.example.js 为 static/config.js 并填入自己的 Key。
         config.js 已加入 .gitignore，不会被提交。 -->
    <script src="static/config.js" onerror="window.__AMAP_CONFIG_MISSING__ = true;"></script>
    <script>
    (function () {
        function warn(html) {
            var show = function () {
                var box = document.getElementById('map-warning');
                if (box) { box.innerHTML = html; box.style.display = 'block'; }
            };
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', show);
            } else {
                show();
            }
        }

        var cfg = window.AMAP_CONFIG || {};
        if (!cfg.key) {
            window.__AMAP_CONFIG_MISSING__ = true;
            warn('<strong>未配置高德地图 Key</strong>：请复制 <code>static/config.example.js</code> ' +
                 '为 <code>static/config.js</code> 并填入自己的 Key，然后刷新页面。' +
                 '（地图功能不可用，图像分析不受影响）');
            return;
        }

        if (cfg.securityJsCode) {
            window._AMapSecurityConfig = { securityJsCode: cfg.securityJsCode };
        }

        var s = document.createElement('script');
        s.src = 'https://webapi.amap.com/maps?v=2.0&key=' + encodeURIComponent(cfg.key);
        s.onerror = function () {
            warn('<strong>高德地图脚本加载失败</strong>：请检查网络连接或 Key 是否有效。');
        };
        s.onload = function () {
            if (typeof window.initAMapApp === 'function') { window.initAMapApp(); }
        };
        document.head.appendChild(s);
    })();
    </script>
</head>
<body>
    <div id="map-warning" class="map-warning" style="display:none;"></div>
    <div id="container"></div>
    
    <div class="control-panel">
        <h2>🏙️ 城市功能区分析</h2>
        <div class="upload-area">
            <label for="imageUpload" class="upload-btn">📤 上传卫星图切片</label>
            <input type="file" id="imageUpload" accept="image/*" style="display:none;">
            <button id="analyzeBtn" class="analyze-btn">🔍 开始分析</button>
        </div>
        <div id="result" class="result-box">
            <p>等待分析...</p>
        </div>
        <div class="legend">
            <h3>功能区图例</h3>
            <div><span class="color-dot" style="background:#FF4B4B;"></span> 商业区</div>
            <div><span class="color-dot" style="background:#4B8BFF;"></span> 居民区</div>
            <div><span class="color-dot" style="background:#FFB84B;"></span> 工业区</div>
            <div><span class="color-dot" style="background:#4BFF4B;"></span> 绿地/公园</div>
        </div>
    </div>

    <!-- 文件名是 scripts.js（带 s）。旧版本误引用为 script.js，导致整份交互逻辑 404。 -->
    <script src="static/scripts.js"></script>
</body>
</html>
